<style>
:root {
    --bg: #fdfbf7;
    --card-bg: #ffffff;
    --text: #201d1a;
    --muted: #837b70;
    --link: #0f5fae;
    --border: #ece5d8;
    --row-hover: #f6f2ea;
}

* { box-sizing: border-box; }

body {
    font-family: "Manrope", "Apple SD Gothic Neo", "Malgun Gothic", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 56px 20px 90px;
    max-width: 760px;
    margin: 0 auto;
    line-height: 1.6;
}

h1 {
    font-family: "Space Grotesk", "Apple SD Gothic Neo", "Malgun Gothic", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 1.75rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 0 0 30px;
}

h2 {
    font-family: "Space Grotesk", "Apple SD Gothic Neo", "Malgun Gothic", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin: 40px 0 12px;
}

ul.listing {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

ul.listing a {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    color: var(--text);
    text-decoration: none;
    padding: 14px 18px;
    border-radius: 14px;
    font-weight: 700;
    box-shadow: 0 1px 2px rgba(32, 29, 26, 0.03);
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease, color 0.15s ease;
}

ul.listing a:hover {
    transform: translateY(-2px);
    border-color: #d8cdb8;
    box-shadow: 0 10px 24px rgba(32, 29, 26, 0.08);
}

ul.listing a:hover .label { color: var(--link); }

ul.listing .count,
ul.listing .badge {
    color: var(--muted);
    font-size: 0.8rem;
    font-weight: 400;
}

ul.listing .badge {
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 1px 9px;
}

footer {
    margin-top: 40px;
    font-size: 0.8rem;
    color: var(--muted);
    text-align: center;
}

@media (max-width: 600px) {
    body { padding: 32px 16px 64px; }
    h1 { font-size: 1.4rem; }
    ul.listing a { padding: 12px 14px; }
}

body { padding-top: 112px; }

.site-nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 50;
    display: flex;
    justify-content: center;
    background: rgba(253, 251, 247, 0.9);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
}

.site-nav-inner {
    display: flex;
    gap: 4px;
    width: 100%;
    max-width: 760px;
    padding: 14px 20px;
}

.site-nav a {
    padding: 7px 15px;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--muted);
    text-decoration: none;
    transition: background 0.15s ease, color 0.15s ease;
}

.site-nav a:hover {
    color: var(--link);
    background: var(--row-hover, var(--code-bg));
}

.site-nav a.active {
    color: var(--link);
    background: var(--row-hover, var(--code-bg));
}

.breadcrumb {
    font-size: 0.8rem;
    color: var(--muted);
    margin: 0 0 20px;
}

.breadcrumb a {
    color: var(--muted);
    text-decoration: none;
}

.breadcrumb a:hover {
    color: var(--link);
    text-decoration: underline;
}

.breadcrumb .sep {
    margin: 0 6px;
    opacity: 0.5;
}

@media (max-width: 600px) {
    body { padding-top: 98px; }
    .site-nav-inner { padding: 10px 16px; gap: 2px; }
    .site-nav a { padding: 5px 10px; font-size: 0.8rem; }
}
</style>
