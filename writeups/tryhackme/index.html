<style>
:root {
    --bg: #fdfbf7;
    --text: #262220;
    --muted: #7a736a;
    --link: #0f5fae;
    --border: #e7e1d6;
    --row-hover: #eef3f8;
}

* { box-sizing: border-box; }

body {
    font-family: "Inter", "Apple SD Gothic Neo", "Malgun Gothic", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 56px 20px 80px;
    max-width: 760px;
    margin: 0 auto;
    line-height: 1.6;
}

h1 {
    font-size: 1.4rem;
    font-weight: 700;
    margin: 0 0 28px;
}

h2 {
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 36px 0 6px;
}

ul.listing {
    list-style: none;
    padding: 0;
    margin: 0;
}

ul.listing li {
    border-bottom: 1px solid var(--border);
}

ul.listing a {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    color: var(--link);
    text-decoration: none;
    padding: 12px 10px;
    border-radius: 6px;
    font-weight: 600;
    transition: background 0.15s ease;
}

ul.listing a:hover {
    background: var(--row-hover);
}

ul.listing a:hover .label { text-decoration: underline; }

ul.listing .count,
ul.listing .badge {
    color: var(--muted);
    font-size: 0.8rem;
    font-weight: 400;
}

ul.listing .badge {
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 1px 9px;
}

footer {
    margin-top: 40px;
    font-size: 0.8rem;
    color: var(--muted);
    text-align: center;
}

@media (max-width: 600px) {
    body { padding: 32px 16px 60px; }
    h1 { font-size: 1.15rem; }
}

body { padding-top: 108px; }

.site-nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 50;
    display: flex;
    justify-content: center;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
}

.site-nav-inner {
    display: flex;
    gap: 4px;
    width: 100%;
    max-width: 760px;
    padding: 12px 20px;
}

.site-nav a {
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--muted);
    text-decoration: none;
    transition: background 0.15s ease, color 0.15s ease;
}

.site-nav a:hover {
    color: var(--link);
    background: var(--row-hover, var(--code-bg));
}

.site-nav a.active {
    color: var(--link);
    background: var(--row-hover, var(--code-bg));
}

.breadcrumb {
    font-size: 0.8rem;
    color: var(--muted);
    margin: 0 0 20px;
}

.breadcrumb a {
    color: var(--muted);
    text-decoration: none;
}

.breadcrumb a:hover {
    color: var(--link);
    text-decoration: underline;
}

.breadcrumb .sep {
    margin: 0 6px;
    opacity: 0.5;
}

@media (max-width: 600px) {
    body { padding-top: 96px; }
    .site-nav-inner { padding: 10px 16px; gap: 2px; }
    .site-nav a { padding: 5px 10px; font-size: 0.8rem; }
